# ============================================================
# Farminix Nginx Reverse Proxy Configuration (KVM2 Server)
# Save as: /etc/nginx/sites-available/farminix
# Enable: ln -s /etc/nginx/sites-available/farminix /etc/nginx/sites-enabled/
# ============================================================

# HTTPS Server for farminix.in & www.farminix.in
server {
    server_name farminix.in www.farminix.in;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/farminix.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farminix.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP Server — handles port 80 for domain and raw IP
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name farminix.in www.farminix.in _;

    client_max_body_size 25M;

    # Redirect domain traffic to HTTPS
    if ($host = "farminix.in") {
        return 301 https://farminix.in$request_uri;
    }
    if ($host = "www.farminix.in") {
        return 301 https://www.farminix.in$request_uri;
    }

    # For raw IP access, proxy directly to app
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
