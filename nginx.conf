# ============================================================
# Farminix Nginx Reverse Proxy Configuration (KVM2 Server)
# Save as: /etc/nginx/sites-available/farminix
# Enable: ln -s /etc/nginx/sites-available/farminix /etc/nginx/sites-enabled/
# ============================================================

# HTTP — Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name farminix.in www.farminix.in;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Main Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name farminix.in www.farminix.in;

    # SSL Certificates (managed by Certbot: sudo certbot --nginx -d farminix.in -d www.farminix.in)
    ssl_certificate /etc/letsencrypt/live/farminix.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farminix.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Client upload limits (allows admin photo/banner uploads up to 25MB)
    client_max_body_size 25M;

    # Proxy to Farminix Express Backend & Frontend on Port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSockets and Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }
}
